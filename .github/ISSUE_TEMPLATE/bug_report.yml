name: 버그 제보
description: 한국어 패치 적용 또는 게임 실행 문제를 제보합니다.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        BIN/CUE, 패치된 전체 디스크, BIOS, 세이브 파일은 첨부하지 마세요.
  - type: input
    id: patch-version
    attributes:
      label: 패치 버전
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: 에뮬레이터와 버전
      placeholder: 이름과 정확한 버전
    validations:
      required: true
  - type: dropdown
    id: disc
    attributes:
      label: 디스크
      options:
        - 디스크 1
        - 디스크 2
        - 패치 적용 단계
        - 알 수 없음
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 진행 위치
      description: 장면, 메뉴, 루트, 직전 선택지를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 문제를 다시 발생시키는 순서를 번호로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 로그
      description: 저작권 자료 전체가 아닌 문제 화면과 텍스트 로그만 첨부해 주세요.
  - type: checkboxes
    id: confirmations
    attributes:
      label: 확인
      options:
        - label: 적용 스크립트가 마지막에 PASS를 출력했습니다.
          required: true
        - label: BIN/CUE, BIOS, 패치된 전체 디스크를 첨부하지 않았습니다.
          required: true
